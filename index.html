<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rúbia - Portfólio</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>

<body>

  <main class="desktop">

    <!-- Ícones da esquerda -->
    <div class="pastas-esquerda">

      <div class="pasta" onclick="abrir('sobre')" role="button" tabindex="0">
        <img src="img/mim.png" alt="Sobre mim" class="icone">
      </div>

      <div class="pasta" onclick="abrir('projetos')" role="button" tabindex="0">
        <img src="img/projetos.png" alt="Projetos" class="icone">
      </div>

    </div>


    <!-- Ícones da direita -->
    <div class="pastas-direita">

      <div class="pasta" onclick="abrir('mais')" role="button" tabindex="0">
        <img src="img/python.png" alt="Mais projetos" class="icone">
      </div>

      <div class="pasta">
        <a href="https://github.com/RubiaRamos"
           target="_blank"
           rel="noopener noreferrer">

          <img src="img/git.png" alt="GitHub" class="icone">

        </a>
      </div>

      <div class="pasta">
        <a href="https://www.linkedin.com/in/rubia-ramos-paula/"
           target="_blank"
           rel="noopener noreferrer">

          <img src="img/llinkedIn.png" alt="LinkedIn" class="icone">

        </a>
      </div>

    </div>

  </main>


  <!-- Janela principal -->
  <section id="janela" class="janela" aria-hidden="true">

    <button
      class="fechar"
      onclick="fechar()"
      aria-label="Fechar janela">
      X
    </button>

    <div id="conteudo"></div>

  </section>


  <!-- Zoom das imagens -->
  <div
    id="zoom"
    class="zoom"
    onclick="fecharZoom()"
    aria-hidden="true">

    <img
      id="imagemZoom"
      src=""
      alt="Imagem ampliada">

  </div>


  <script src="script.js"></script>

</body>

</html>
